<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Function scope example</title>
</head>

<body>

    <script>
        const x = 1;

        function a() {
            const y = 2;
            // z can't be accessed by the output func as it's outside of a()'s scope
            output(z);
        }

        function b() {
            const z = 3;
            // y can't be accessed by the output func as it's outside of b()'s scope
            output(y)

            // x can be accessed by the output func as it's a global variable
            output(x)
        }

        function output(value) {
            const para = document.createElement('p');
            document.body.appendChild(para);
            para.textContent = `Value: ${value}`;
        }

        const p = 4;
        let q = 5;

        // scope of variables inside a conditional
        if (x === 1) {
            // these variables cannot be accessed by a func outside of this scope
            const c = 4;
            let d = 5;
        }


        // scope of variables inside a loop
        for (let i = 0; i <= 1; i++) {
            const e = 6;
            let f = 7;

            // var makes the variable as a global variable
            var g = 'This will print because we use "var" while defining this variable'
        }


        // Variables declared with var inside functions, still have their scope limited to those functions.
        function c() {
            var new_var = "This will not get printed because var is used in a function";
        }

    </script>
</body>

</html>
