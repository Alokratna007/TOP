<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow functions</title>
</head>

<body>
    <script>

        // 2 types of arrow functions
        // 1. single line (short)
        // 2. multi-line (curly braces and return keyword are used)

        // 1. single line arrow functions
        // LHS value to arrow --> parameter of func & 
        // RHS value to arrow --> return statement/expression
        let double = num => num * 2;
        // we could have also used (num) instead of num before the arrow symbol
        // here, num => num*2; is the same as:
        // function (num) { return num * 2 }

        // 2. multi-line arrow functions
        let triple = num => {
            let tripled = num * 3;
            return tripled;
        }
        // use of curly braces along with return keyword is compulsory here

        alert(double(3));
        alert(triple(4));


        // javascript.info task answers
        function ask(question, yes, no) {
            if (confirm(question)) yes();
            else no();
        }

        ask(
            "Do you agree?",
            () => alert("You agreed."),
            () => alert("You canceled the execution.")
        );

    </script>
</body>

</html>
